apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def keystoreFile = rootProject.file('keystore/app-release.keystore')

android {
    namespace 'com.example.bullsandcows'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.bullsandcows"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile keystoreFile
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'bullsandcows'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                // Ключа ещё нет: подписываем release debug-ключом, чтобы APK можно было ставить
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
